[package]
name = "localmind"
version = "2.1.4"
edition = "2021"
build = "build.rs"

[dependencies]
tao = "0.30"
wry = "0.45"
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
ureq = { version = "2.10", features = ["json"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
rfd = "0.17.2"
# sha256 de verificación de descargas (P6/P9): una sola crate pequeña, sin
# runtime extra; la alternativa sería ~300 líneas de SHA-256 propio.
sha2 = "0.10"
semver = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
getrandom = "0.2"
tray-icon = "0.26"
muda = "0.21"

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
